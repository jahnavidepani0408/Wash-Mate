        <section id="guide-overview" aria-labelledby="overview-title">
          <h2 id="overview-title">Everything for laundry day, in one dashboard</h2>
          <p>
            The Wash Mate student dashboard is designed to make common laundry
            tasks easier to find and simpler to complete.
          </p>
          <div class="noscript-features">
            <article>
              <h3>Book a laundry slot</h3>
              <p>
                Select a laundry date and time, choose the clothing items you
                are sending, and review the booking details before confirming.
              </p>
            </article>
            <article>
              <h3>Check machine availability</h3>
              <p>
                See the machine list and its displayed status before you plan a
                trip to the laundry room.
              </p>
            </article>
            <article>
              <h3>Track your laundry</h3>
              <p>
                Review booking progress, keep your handover identifier nearby,
                and check which orders are ready for collection.
              </p>
            </article>
            <article>
              <h3>Keep account details together</h3>
              <p>
                Maintain a student profile, see booking history, review saved
                reports, and adjust available preferences.
              </p>
            </article>
          </div>
        </section>

        <section id="guide-booking" aria-labelledby="booking-title">
          <h2 id="booking-title">How to book a laundry slot</h2>
       
          <ol>
            <li>Open <strong>Book a laundry slot</strong> from the dashboard menu.</li>
            <li>Choose the date you plan to bring your laundry.</li>
            <li>Select an available time from the time-slot list.</li>
            <li>Use the plus and minus controls to enter item quantities.</li>
            <li>Check the total item count and estimated weight.</li>
            <li>Choose a wash type that suits your clothes.</li>
            <li>Add any useful washing instructions, if needed.</li>
            <li>Review your selections and confirm the booking.</li>
            <li>Keep the booking identifier for the laundry handover.</li>
          </ol>
        
        
        </section>

        <section aria-labelledby="booking-details-title">
          <h2 id="booking-details-title">Before you confirm</h2>
          <ul>
            <li>Check that the date and time match your plans.</li>
            <li>Count each kind of clothing carefully.</li>
            <li>Use special instructions for relevant garment-care needs.</li>
            <li>Make sure the selected wash type is appropriate.</li>
            <li>Save or note the booking ID shown after confirmation.</li>
          </ul>
          <p>
            The estimated load weight is calculated from sample per-item
            weights. It is an estimate rather than a scale measurement.
          </p>
        </section>

        <section id="guide-machines" aria-labelledby="machines-title">
          <h2 id="machines-title">Machine availability</h2>
          <p>
            The machine page groups washers and dryers with a short description
            and a status such as available, in use, or maintenance.
          </p>
          <ul>
            <li><strong>Available</strong> means the sample listing marks it ready.</li>
            <li><strong>In use</strong> means the sample listing marks it occupied.</li>
            <li><strong>Maintenance</strong> means the sample listing flags a service issue.</li>
          </ul>
         
          <p>
            Confirm actual availability with your laundry room before relying
            on a displayed sample status.
          </p>
        </section>

        <section id="guide-tracking" aria-labelledby="tracking-title">
          <h2 id="tracking-title">Track laundry from drop-off to collection</h2>
          <p>
            The tracking page lists bookings that have not been completed or
            cancelled and displays their current status.
          </p>
          <ol>
            <li>Open <strong>Laundry tracking</strong> from the student menu.</li>
            <li>Find the booking by its ID and selected date.</li>
            <li>Review the time, item count, and wash type.</li>
            <li>Open the booking code when preparing for handover.</li>
            <li>Check the status before collecting your items.</li>
          </ol>
          <p>
            Available  statuses include confirmed, received, washing, ready
            for collection, and completed.
          </p>
         
        </section>

        <section aria-labelledby="handover-title">
          <h2 id="handover-title">Handover and collection reminders</h2>
          <ul>
            <li>Bring the booking ID shown in your booking details.</li>
            <li>Confirm the item count with the laundry team at handover.</li>
           
            <li>Inspect items at collection and report any issue promptly.</li>
          </ul>
          <p>
            The visual booking-code pattern is only a demo identifier. It is not
            a standards-compliant QR code and does not verify identity.
          </p>
        </section>

        <section id="guide-history" aria-labelledby="history-title">
          <h2 id="history-title">Booking history and receipts</h2>
          <p>
            Booking history helps you review recent and past laundry activity,
            including its date, time, item count, and status.
          </p>
          <ul>
            <li>Use the history list to locate a booking by its ID.</li>
            <li>Open a receipt to save a text summary of its details.</li>
            <li>Review the booking status before requesting a change.</li>
            <li>Cancel an eligible upcoming booking from its action controls.</li>
          </ul>
          <p>
            Receipts in this demo are informational summaries. No payment is
            processed and no real charge is made.
          </p>
        </section>

        <section id="guide-profile" aria-labelledby="profile-title">
          <h2 id="profile-title">Student profile and account</h2>
          <p>
            The profile form collects the information used to identify your
            student account within this browser demonstration.
          </p>
          <ul>
            <li>Enter your name and registration number accurately.</li>
            <li>Complete the required contact and residence fields.</li>
            <li>Add a profile photo only if you want one on this device.</li>
            <li>Review your information before saving profile changes.</li>
            <li>Use your profile page to update account details or change the demo password.</li>
          </ul>
         
         
        </section>

        <section aria-labelledby="notifications-title">
          <h2 id="notifications-title">Notifications</h2>
       
          <p>
            Email, text-message, and browser push notifications are not
            configured in this sample application.
          </p>
        </section>

        <section aria-labelledby="feedback-title">
          <h2 id="feedback-title">Feedback and issue reports</h2>
          <p>
            Use the feedback form to select a rating and describe your laundry
            experience for this local demo.
          </p>
          <p>
            Use the complaints form to record an issue type, related booking,
            and a description of what happened.
          </p>
          <p>
            Submissions are saved in the current browser account only. They are
            not delivered to campus administration or reviewed by staff.
          </p>
        </section>

        <section id="guide-support" aria-labelledby="support-title">
          <h2 id="support-title">Help and support</h2>
          <p>
            The help page includes guidance for common booking, cancellation,
            and handover questions.
          </p>
          <p>
            Contact your campus laundry administration for time-sensitive
            issues or help with an actual laundry order.
          </p>
          <p>
            The sample support email address must be replaced with the correct
            campus contact before a real deployment.
          </p>
        </section>

        <section aria-labelledby="settings-title">
          <h2 id="settings-title">Accessibility</h2>
          <ul>
            <li>Use a keyboard to move between links, controls, and form fields.</li>
            <li>Reduced-motion preferences are respected on supported devices.</li>
          </ul>
        </section>

        <section id="guide-faq" aria-labelledby="faq-title">
          <h2 id="faq-title">Frequently asked questions</h2>
          <div class="noscript-features">
            <article>
              <h3>How do I create an account?</h3>
              <p>Enable JavaScript, choose Sign up, and complete the account form.</p>
            </article>
            <article>
              <h3>What if I cannot sign in?</h3>
              <p>Check the email and password saved in this browser account.</p>
            </article>
            <article>
              <h3>Why do I need a student profile?</h3>
              <p>The interactive dashboard asks for a profile before opening its other pages.</p>
            </article>
            <article>
              <h3>Can I book more than one slot?</h3>
              <p>The demo applies a local daily booking limit and prevents same-account slot duplicates.</p>
            </article>
            <article>
              <h3>Can I choose any laundry date?</h3>
              <p>The booking form offers today or a future date; past dates are not intended.</p>
            </article>
            <article>
              <h3>Can I change a booking?</h3>
              <p>Use the reschedule action for an eligible booking and select a new date and time.</p>
            </article>
            <article>
              <h3>Can I cancel a booking?</h3>
              <p>Eligible upcoming bookings can be cancelled from the booking history list.</p>
            </article>
            <article>
              <h3>Where can I see an order status?</h3>
              <p>Open Laundry tracking to see active booking statuses for this account.</p>
            </article>
            <article>
              <h3>Is the booking code a real QR code?</h3>
              <p>No. It is a visual demo identifier and cannot be scanned for verification.</p>
            </article>
            <article>
              <h3>Are the machine statuses live?</h3>
              <p>No. Machine entries are sample data and are not connected to laundry equipment.</p>
            </article>
            <article>
              <h3>Where is my profile stored?</h3>
              <p>Account information is stored in the current browser on this device.</p>
            </article>
            <article>
              <h3>Can staff see my complaint?</h3>
              <p>No. Demo feedback and complaints stay local and are not sent to staff.</p>
            </article>
            <article>
              <h3>Will I get an email reminder?</h3>
              <p>Email and push notifications require a notification service that is not configured.</p>
            </article>
          </div>
        </section>

        <section aria-labelledby="privacy-title">
          <h2 id="privacy-title">Important demo and privacy information</h2>
          <p>
            Wash Mate in this workspace is a browser-based demonstration, not a
            production campus service.
          </p>
          <ul>
            <li>Account data is stored locally in browser storage.</li>
            <li>Clearing browser data may remove this demo account and its records.</li>
            <li>Local data is not a secure substitute for a protected database.</li>
            <li>Bookings are not shared with a campus laundry room.</li>
            <li>Machine availability is not live.</li>
            <li>Payments, verification, and staff authorization are not configured.</li>
          </ul>
          <p>
            A production deployment needs a protected backend, verified accounts,
            authorized staff roles, and server-enforced booking rules.
          </p>
        </section>
